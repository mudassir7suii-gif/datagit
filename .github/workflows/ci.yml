name: DataGit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datagit
          POSTGRES_PASSWORD: datagit_dev_password
          POSTGRES_DB: datagit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        run: |
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://datagit:datagit_dev_password@localhost:5432/datagit_test
          DATAGIT_JWT_SECRET: ci_jwt_secret_test_key_32_bytes_minimum_length_required

      - name: Run Python unit & integration tests
        run: |
          python -m unittest discover -s tests
        env:
          DATAGIT_JWT_SECRET: ci_jwt_secret_test_key_32_bytes_minimum_length_required
          DATAGIT_ENCRYPTION_KEY: ci_encryption_test_key_32_bytes_len_!!

  test-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datagit-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: datagit-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build
