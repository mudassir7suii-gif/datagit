name: PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Build & Deploy Ephemeral Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Preview Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: datagit/api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Preview Bundle
        working-directory: datagit-frontend
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://preview-api-pr-${{ github.event.pull_request.number }}.datagit.dev

      - name: Post Preview URL Comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://preview-pr-${prNumber}.datagit.dev`;
            const commentBody = `### 🚀 DataGit Ephemeral PR Preview Deployed!\n\n- **Preview App:** [${previewUrl}](${previewUrl})\n- **API Documentation:** \`${previewUrl}/docs\`\n- **Commit:** \`${context.sha.substring(0, 7)}\`\n\n*This ephemeral preview is automatically updated with each push.*`;
            
            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });
            const botComment = comments.data.find(c => c.body.includes("DataGit Ephemeral PR Preview Deployed"));
            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
